name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [asan, release]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        # CI boxes are heterogeneous: neutralise -march=native from the
        # release preset; perf numbers never come from CI (DESIGN §9.7).
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  tsan:
    name: clang / tsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset tsan
      - name: Build
        run: cmake --build --preset tsan
      - name: Test
        run: ctest --preset tsan
